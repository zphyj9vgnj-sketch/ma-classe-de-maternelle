<style>
:root { --bg:#f3f7f6; --card:#ffffff; --ink:#1d2b2c; --muted:#5a6d6e; --accent:#2f6f73; --accent-ink:#ffffff; --soft:#e3efee; --line:#d3dfde; --field:#fbfdfd; --danger:#a63d3d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101a1b; --card:#182526; --ink:#e8f1f0; --muted:#9bb0b1; --accent:#6fc0c4; --accent-ink:#0d1b1c; --soft:#203334; --line:#2b4041; --field:#142021; --danger:#e07b7b; } }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size:16px; line-height:1.45; overflow-x:hidden; overflow-x:clip; }
*, *::before, *::after { box-sizing:border-box; }
#app { height:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; position:relative; }
#view { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overflow-x:clip; padding:max(14px, calc(env(safe-area-inset-top, 0px) + 10px)) 16px 20px; touch-action:pan-y; }
h1 { font-size:26px; margin:6px 0 4px; line-height:1.2; }
h2 { font-size:19px; margin:0 0 8px; }
h3 { font-size:16px; margin:14px 0 6px; }
p { margin:0 0 8px; }
.muted { color:var(--muted); } .small { font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin:0 0 12px; }
.row { display:flex; gap:8px; align-items:center; } .row.wrap { flex-wrap:wrap; } .grow { flex:1; min-width:0; }
.stack { display:flex; flex-direction:column; gap:8px; }
.btn { appearance:none; line-height:1.25; padding-top:8px; padding-bottom:8px; border:0; border-radius:14px; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; min-height:48px; padding:0 16px; width:100%; cursor:pointer; }
.btn.secondary { background:var(--soft); color:var(--ink); }
.btn.danger { background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
.btn.small { min-height:40px; width:auto; font-size:15px; padding:0 14px; }
.link { appearance:none; background:none; border:0; color:var(--accent); font:inherit; text-decoration:underline; padding:8px 4px; cursor:pointer; }
.chip { appearance:none; border:1.5px solid var(--line); background:var(--field); color:var(--ink); border-radius:999px; font:inherit; font-size:15px; min-height:40px; padding:0 14px; cursor:pointer; }
.chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.tag { display:inline-block; background:var(--soft); border-radius:10px; padding:3px 9px; font-size:13px; margin:0 6px 6px 0; border-left:5px solid var(--accent); }
.dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; flex:none; }
label { display:block; font-weight:600; font-size:15px; margin:12px 0 4px; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], textarea, select { width:100%; border:1.5px solid var(--line); border-radius:14px; background:var(--field); color:var(--ink); font:inherit; font-size:16px; padding:12px; }
input[type=date], input[type=time] { -webkit-appearance:none; appearance:none; display:block; min-height:50px; min-width:0; max-width:100%; margin:0; text-align:center; overflow:hidden; }
input[type=time]::-webkit-date-and-time-value, input[type=date]::-webkit-date-and-time-value { text-align:center; margin:0 auto; }
textarea { min-height:96px; resize:vertical; }
.bar { height:10px; background:var(--soft); border-radius:999px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; }
.block { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-left-width:8px; border-radius:16px; padding:12px 14px; margin:0 0 10px; font:inherit; color:var(--ink); cursor:pointer; }
.block .time { font-weight:700; font-size:15px; }
#nav { display:flex; border-top:1px solid var(--line); background:var(--card); padding-bottom:env(safe-area-inset-bottom, 0px); }
#nav button { flex:1; min-width:0; background:none; border:0; font:inherit; font-size:11.5px; color:var(--muted); padding:9px 2px 7px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
#nav button.on { color:var(--accent); font-weight:700; }
#nav svg { width:23px; height:23px; }
#sheet { display:none; position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.4); }
#sheet.open { display:block; }
#sheet .panel { position:absolute; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; max-height:92%; overflow-y:auto; background:var(--bg); border-radius:22px 22px 0 0; padding:16px 16px max(18px, env(safe-area-inset-bottom, 0px)); }
.opt { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin:0 0 8px; font:inherit; color:var(--ink); cursor:pointer; }
.opt.on { border-color:var(--accent); background:var(--soft); }
.opt .ck { flex:none; width:22px; height:22px; border-radius:7px; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1; margin-top:1px; }
.opt.on .ck { background:var(--accent); color:var(--accent-ink); }
.opt .grow, .seance .grow > div { white-space:pre-line; }
.seance { border:1px dashed var(--line); border-radius:16px; padding:12px; margin:0 0 12px; background:var(--card); }
.sw { width:34px; height:34px; border-radius:50%; border:3px solid transparent; padding:0; cursor:pointer; }
.sw.on { border-color:var(--ink); }
.hint { font-size:13px; color:var(--muted); margin:4px 0 0; }
.done { text-decoration:line-through; color:var(--muted); }
.todo { display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-left-width:8px; border-radius:14px; padding:10px 12px; margin:0 0 8px; }
.todo input[type=checkbox] { width:24px; height:24px; flex:none; margin-top:2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
audio, video { width:100%; margin-top:8px; border-radius:12px; }
#print { display:none; }
@media print { #app, #sheet { display:none !important; } #print { display:block; color:#000; background:#fff; padding:0; font-size:11pt; } #print h1 { font-size:17pt; } #print .pb { border:1px solid #999; border-radius:6px; padding:8px; margin:0 0 8px; page-break-inside:avoid; } #print h4 { margin:6px 0 2px; font-size:10.5pt; } #print p { margin:0 0 4px; white-space:pre-wrap; } html, body { background:#fff; height:auto; overflow:visible; } }
</style>

(function () {
'use strict';
var PROG = [{"nom":"Le développement et la structuration du langage oral et écrit","sous":[{"nom":"Acquérir le langage oral","groupes":[{"nom":"Enrichir son vocabulaire","ages":{"<4":["Comprendre, mémoriser, réemployer les mots des corpus enseignés (2 par période).","Organiser les mots en catégorie et en réseau."],"4+":["Comprendre, mémoriser, réemployer les mots des corpus enseignés (2 par période).","Organiser les mots en catégorie et en réseau."],"5+":["Comprendre, mémoriser, réemployer les mots des corpus enseignés (3 par période).","Organiser les mots en catégorie et en réseau."]}},{"nom":"Développer sa syntaxe","ages":{"<4":["Diversifier les pronoms employés.","Construire à l’oral un système de temps de plus en plus efficace.","Formuler des énoncés de plus en plus complexes."],"4+":["Diversifier les pronoms employés.","Construire à l’oral un système de temps de plus en plus efficace.","Formuler des énoncés de plus en plus complexes."],"5+":["Diversifier les pronoms employés.","Construire à l’oral un système de temps de plus en plus efficace.","Formuler des énoncés de plus en plus complexes."]}},{"nom":"Articuler distinctement","ages":{"<4":["Articuler distinctement les couples de consonnes proches suivants : t/k, f/s, m/n."],"4+":["Distinguer et produire correctement les nasales : é/in, a/an, o/on.","Articuler distinctement les couples de consonnes proches suivants : f/v, s/z, p/b, t/d, k/g."],"5+":["Prononcer correctement les couples de consonnes proches suivants : ch/s, ch/j, ch/z.","Prononcer correctement les doubles consonnes : br/cr/bl/pl/sl."]}},{"nom":"Produire des discours variés","ages":{"<4":["Entrer en communication verbale avec un adulte ou un autre élève.","Dire ce qu’on fait.","Dire ce qu’on a fait et, peu à peu, ce qu’on va faire.","Prendre part à l’oralisation d’un court texte mémorisé."],"4+":["Dire ce qu’on va faire.","Dire comment on a fait ou comment on va faire.","Oraliser un court texte mémorisé.","Participer à des échanges en restant dans le propos."],"5+":["Décrire une action ou une activité qui a été menée par un autre élève.","Se faire comprendre, par le truchement du langage, d’un adulte qui ne connait rien à la situation évoquée.","Participer à une conversation avec un adulte ou des pairs et reformuler son propos s’il n’a pas été compris.","Émettre une hypothèse."]}}]},{"nom":"Passer de l’oral à l’écrit : se préparer à apprendre à lire","groupes":[{"nom":"Acquérir les habiletés phonologiques et le principe alphabétique","ages":{"<4":["Identifier les sons de la langue, lors de situations d’écoute proposées par le professeur.","Identifier un mot donné à l’oral dans une phrase, dans un texte.","Scander les syllabes d’un mot.","Dire des comptines courtes comprenant des phonèmes proches.","Reconnaitre et nommer certaines lettres de son prénom écrit en capitales."],"4+":["Utiliser la voix parlée, chantée et les possibilités vocales (imitation de sons, onomatopées) afin d’expérimenter différents sons.","Entendre, discriminer des phonèmes.","Scander les syllabes d’un mot.","Manipuler les syllabes d’un mot (ajout, suppression, permutation, répétition, fusion, substitution).","Dire des comptines courtes comprenant des phonèmes proches.","Nommer les lettres de son prénom et quelques lettres de mots connus (le professeur nomme systématiquement les lettres).","Connaitre la correspondance entre les lettres scriptes majuscules et minuscules et les lettres cursives minuscules.","Donner les valeurs sonores de quelques lettres de mots simples connus."],"5+":["Utiliser les possibilités sonores de la voix.","Augmenter sa mémoire auditive et sa capacité de concentration.","Supprimer, ajouter, remplacer, inverser, substituer, fusionner les syllabes d’un mot.","Repérer et produire des rimes et des assonances.","Entendre, discriminer, manipuler des phonèmes.","Connaitre le nom des lettres de l’alphabet.","Connaitre les différentes graphies d’une même lettre (majuscule lettre capitale ; minuscules scriptes ; cursives).","Distinguer des lettres visuellement proches (b/d, c/e/o, p/q) grâce à leur écriture cursive et les nommer correctement.","Connaitre le nom des lettres de l’alphabet et leur valeur sonore hormis les occlusives.","Discriminer des mots auditivement proches."]}},{"nom":"S’éveiller à la diversité linguistique","ages":{"<4":["Écouter des chants, des comptines, des histoires connues dans des versions en français et en langue étrangère."],"4+":["Participer à des jeux dans une autre langue : jeux de doigts, rondes, jeux dansés, mimes, jeux de cour, jeux de cartes.","Comparer des histoires lues en français et dans une autre langue."]}},{"nom":"Écouter et comprendre différentes formes d’écrits","ages":{"<4":["Repérer les outils fonctionnels utilisés quotidiennement en classe (étiquette du prénom, emploi du temps, affiches, etc.).","Reconnaitre quelques écrits utilisés et produits en classe (comptines, recettes, carnet de lecteur).","Reconnaitre un personnage, le nommer et le situer dans les illustrations.","Comprendre des histoires où l’enchainement des actions peut être rattaché à des expériences connues de la vie quotidienne (le bain, le coucher, etc.)."],"4+":["Reconnaitre, nommer et identifier la fonction de différents écrits rencontrés dans la vie courante.","Prendre conscience de la notion de destinataire et de contenu de la requête adressée par un écrit.","Identifier et utiliser quotidiennement des outils fonctionnels pour se repérer, s’organiser, ranger.","Identifier et décrire le personnage principal et les personnages secondaires.","Comprendre des histoires dont les actions sont organisées autour d’une structure répétitive (rencontres successives) et commencer à comprendre les informations implicites (émotions, états et sentiments des personnages)."],"5+":["Différencier les types d’écrits et associer un écrit à un projet d’écriture ou de communication.","Repérer et dégager la structure et l’organisation (mise en page, typographie) de formes d’écrits fréquemment utilisés en classe (structure de la lettre, de la recette, du conte, d’un écrit documentaire, d’une notice de fabrication).","Construire les caractéristiques des personnages archétypaux (loup, princesse, ogre, sorcière, renard, fée, etc.).","Comprendre des histoires où l’enchainement des actions est lié au destin de personnages centraux ou secondaires qui évoluent et interagissent, dans des lieux diversifiés.","Comprendre les émotions, les intentions et les sentiments qui animent les personnages.","Établir un lien entre la lecture effectuée et sa propre expérience."]}}]},{"nom":"Passer de l’oral à l’écrit : se préparer à apprendre à écrire","groupes":[{"nom":"Apprendre le geste d’écriture","ages":{"<4":["Participer aux activités de motricité générale, de motricité fine et aux exercices de graphismes ;","Guider son geste par le regard lorsqu’il trace ou écrit ;","Prendre des repères spatiaux sur le support utilisé pour tracer."],"4+":["Adopter une posture adaptée au geste d’écriture.","Adopter une préhension correcte du stylo et s’entrainer à ne pas le lever en écrivant.","Utiliser de façon coordonnée les quatre articulations qui servent à tenir et guider le crayon (épaule, coude, poignet, doigts).","Tracer des lettres capitales.","S’initier aux tracés de l’écriture cursive."],"5+":["Tenir correctement son stylo par la pince des doigts et utiliser de façon coordonnée les quatre articulations (épaule, coude, poignet, doigts).","Travailler la ligature entre deux lettres.","Tracer des lettres en écriture cursive, les enchainer."]}},{"nom":"Produire de premiers écrits","ages":{"<4":["Percevoir que l’écrit encode l’oral.","Utiliser un support écrit connu.","Mimer la posture et les gestes d’écriture de l’adulte lors de la production de traces qui s’apparentent à de l’écriture.","Tracer volontairement des signes abstraits dont on comprend qu’il ne s’agit pas de dessins, mais de lettres."],"4+":["Comprendre que lorsque l’adulte lit un même écrit plusieurs fois, ce qu’il lit est toujours identique.","Comprendre que l’écrit code des sons.","Proposer au professeur, lors d’une activité de dictée à l’adulte, le contenu d’un court message, stabiliser un énoncé oral et le mémoriser pour pouvoir ensuite le dicter au professeur.","Comparer la longueur d’un texte écrit et la durée du texte entendu.","Savoir que le sens de la lecture est de gauche à droite et de haut en bas.","Chercher parmi les outils à sa disposition des modèles qui seront réutilisés dans un essai d’écriture."],"5+":["Segmenter l’oral en mots, les mots en syllabes, quelques syllabes en phonèmes.","Comprendre que l’écrit encode l’oral et que les sons de la langue sont codés par des lettres.","Suivre la trace écrite des yeux lors d’une relecture par l’adulte d’un message produit lors d’une dictée à l’adulte.","Mémoriser la graphie d’un mot transparent, en s’appuyant sur la connaissance des lettres et la conscience phonologique et le retranscrire sur un support.","Réinvestir ses premières connaissances relatives au principe alphabétique pour produire un écrit.","Se repérer dans l’alphabet pour retrouver l’écriture d’une lettre nécessaire pour produire un écrit.","Mémoriser l’écriture de mots transparents ou de syllabes connues pour les réutiliser dans une production d’écrit.","Comprendre qu’il existe une norme pour écrire : ponctuation, majuscules, mise en page, etc.","Persévérer pour mener la production d’écrit à son terme : préparation, énonciation et révision."]}}]}]},{"nom":"Agir, s’exprimer, comprendre à travers les activités physiques","sous":[{"nom":"Se déplacer","groupes":[{"nom":"Manipuler, courir, sauter, lancer, s’orienter","ages":{"<4":["Manipuler et lancer des objets avec des intentions motrices différentes.","Courir de manière variée et coordonnée.","Sauter sans élan un obstacle.","Se situer dans un espace proche et connu en utilisant des indices présents dans l’environnement."],"4+":["Lancer loin de manière coordonnée.","Courir vite en ligne droite sur une distance ou une durée courte.","Sauter sans élan plusieurs obstacles.","Se situer dans un espace élargi et connu grâce à des indices prélevés dans l’environnement."],"5+":["Lancer loin et avec précision différents objets.","Courir de plus en plus longtemps sans s’arrêter.","Courir vite et franchir un obstacle sur une distance courte.","Coordonner ses actions et ses déplacements pour lancer et pour sauter haut ou loin.","Se situer dans un milieu moins connu grâce à des indices prélevés dans l’environnement."]}}]},{"nom":"Construire des équilibres","groupes":[{"nom":"Tourner, se suspendre, se renverser, grimper, rouler, glisser, nager","ages":{"<4":["Développer de nouveaux équilibres par des modes de déplacement variés.","Développer de nouveaux équilibres dans des environnements de pratiques inhabituels et sécurisés."],"4+":["Développer de nouveaux équilibres par des déplacements impliquant une perte de repères habituels.","Comprendre l’intérêt des règles de sécurité dans des activités et environnements inhabituels."],"5+":["Construire de nouveaux équilibres par des déplacements impliquant une combinaison d’actions.","Explorer le milieu aquatique et développer une nouvelle locomotion dans l’eau.","Respecter les règles de sécurité pour soi et pour les autres."]}}]},{"nom":"S’exprimer avec son corps","groupes":[{"nom":"Explorer, s’exprimer, danser, observer","ages":{"<4":["Découvrir et explorer le mouvement comme vecteur d’expression.","Oser s’exprimer avec son corps seul et avec les autres en répondant à une consigne simple.","Observer pour produire et reproduire un ou plusieurs mouvements avec une intention d’expression."],"4+":["Découvrir et explorer le geste dansé.","Découvrir l’espace scénique.","Développer une posture de spectateur et de spectatrice actifs."],"5+":["Enrichir le geste dansé par de nouvelles coordinations motrices, issues également des arts du cirque.","Explorer l’ensemble de l’espace scénique en variant les inducteurs (objets, mondes sonores, modes de déplacements, etc.) pour créer des effets.","Danser, seul ou à plusieurs, en créant et en reproduisant un ou plusieurs gestes et déplacements.","Adopter une posture de spectateur et de spectatrice actifs."]}}]},{"nom":"Coopérer et s’opposer","groupes":[{"nom":"Coopérer, s’opposer, respecter","ages":{"<4":["Comprendre et s’approprier un rôle dans les formes de jeu les plus simples.","Explorer différents jeux moteurs vécus en interindividuel ou en collectif.","Éprouver le plaisir de jouer dans le respect des autres et des règles communes."],"4+":["Jouer en coopérant.","Jouer en exerçant des rôles différents : attaquant, attaquante et défenseur, défenseuse.","Coopérer dans le respect des autres et des règles communes."],"5+":["Élaborer seul ou à plusieurs des stratégies pour gagner un jeu.","Jouer en exerçant des rôles différents : attaquant, attaquante, défenseur, défenseuse et arbitre.","Éprouver le plaisir de coopérer et de s’opposer dans le respect des autres et des règles communes."]}}]}]},{"nom":"Agir, s’exprimer, comprendre à travers les activités artistiques","sous":[{"nom":"Arts visuels","groupes":[{"nom":"Dessiner","ages":{"<4":["S’exercer au dessin pour développer son habileté motrice.","S’exercer progressivement au dessin avec une intention de représentation."],"4+":["Expérimenter la diversité des outils, des supports, des matériaux et faire des choix.","S’exercer au dessin avec une intention de représentation."],"5+":["Dessiner pour représenter sur la base d’un modèle.","Dessiner pour représenter un personnage ou un évènement fictif.","Participer à la réalisation d’une œuvre collective à partir d’une consigne ou d’un problème à résoudre.","Utiliser le vocabulaire spécifique au dessin."]}},{"nom":"S’exercer au graphisme artistique","ages":{"<4":["Explorer des gestes et commencer à les associer à des types de tracés précis.","Repérer des motifs graphiques issus de son environnement proche.","Découvrir des expressions graphiques dans des œuvres d’art."],"4+":["Exercer et développer sa motricité fine.","Repérer des motifs graphiques issus de son environnement.","Reproduire et créer des motifs de plus en plus élaborés."],"5+":["Transformer ou détourner des motifs du répertoire de la classe pour observer les effets produits.","Créer de nouveaux motifs.","Réaliser une composition à partir de plusieurs contraintes."]}},{"nom":"Réaliser des compositions planes ou en volume","ages":{"<4":["Explorer l’usage des outils et observer leurs effets sur le geste.","Utiliser différents médiums et observer leurs effets sur les couleurs, les formes et les volumes.","Expérimenter la résistance de certains matériaux.","Réaliser individuellement ou collectivement une production plastique en volume."],"4+":["S’approprier les constituants plastiques (couleurs, formes, matières, rythmes, etc.).","Réaliser une composition en deux ou trois dimensions en fonction d’un projet individuel ou collectif.","Découvrir différentes formes d’expression artistique."],"5+":["Réaliser des compositions plastiques, seul ou en petit groupe, en choisissant et combinant des matériaux et en réinvestissant des techniques et des procédés.","Se familiariser avec différentes formes d’expression artistique."]}},{"nom":"Observer, comprendre et transformer des images","ages":{"<4":["Apprendre à regarder avec attention et à identifier des éléments visuels.","Découvrir quelques éléments constitutifs d’une illustration."],"4+":["Différencier une image fixe d’une image animée.","Fabriquer des images à partir d’images existantes.","Identifier et nommer des éléments graphiques d’une illustration."],"5+":["Différencier des types d’images (portrait, paysage, nature morte, etc.).","Identifier et nommer des éléments esthétiques d’une illustration."]}}]},{"nom":"Les univers sonores","groupes":[{"nom":"Jouer avec sa voix et acquérir un répertoire de comptines et de chansons","ages":{"<4":["Dépasser les usages courants de la voix.","Chanter en se faisant comprendre des autres.","Dire ou cha x","ages":{"<4":["Reconnaitre et comparer des matériaux usuels à partir de perceptions sensorielles.","Repérer des transformations de matériaux sous l’effet d’actions mécaniques avec les mains ou avec des outils.","Utiliser des objets, connaitre leur nom et leur fonction.","Réaliser une construction, fabriquer un objet librement ou par un guidage pas à pas."],"4+":["Différencier des matériaux en fonction de leurs propriétés et différencier un objet du matériau qui le constitue.","Désigner et utiliser des outils ou des objets adaptés à une situation et à une action technique.","Réaliser une construction, fabriquer un objet à partir d’un modèle.","Reproduire quelques gestes respectueux de l’environnement montrés par l’adulte."],"5+":["Associer une solution technique à une fonction technique.","Fabriquer un objet en réponse à un besoin en exploitant des propriétés de matériaux ou des phénomènes physiques (équilibre, magnétisme, perméabilité, opacité ou transparence).","Explorer la notion de flottabilité avec des objets pleins constitués d’une seule et même matière : observer que, plongés dans l’eau, ils flottent tous ou coulent tous.","Construire, fabriquer, réaliser en suivant une recette ou une fiche technique.","Élaborer une suite d’instructions pour réaliser une tâche simple.","Identifier et prévenir les risques liés à certains objets."]}},{"nom":"Découvrir les états de la matière et les mélanges","ages":{"<4":["Explorer quelques caractéristiques des solides et des liquides.","Constater les effets d’un déplacement d’air sur des objets ou sur soi-même.","Réaliser et observer des mélanges.","Découvrir et observer la fusion et la solidification de l’eau."],"4+":["Identifier une condition favorable à la fusion de la glace.","Mettre en évidence la présence d’air en le mettant en mouvement.","Distinguer les solides qui se dissolvent dans l’eau de ceux qui ne se dissolvent pas."],"5+":["Identifier et nommer l’état de l’eau dans différentes situations.","Identifier la présence de l’air quand il est perceptible par les sens.","Distinguer, parmi quelques solides, ceux qui peuvent se dissoudre dans l’eau.","Commencer à agir de manière autonome pour le respect de l’environnement.","Prendre en compte les risques de l’environnement familier."]}}]}]},{"nom":"Éducation à la vie affective et relationnelle (EVAR)","sous":[{"nom":"Se connaître, vivre et grandir avec son corps","groupes":[{"nom":"Objectif d’apprentissage","ages":{"<4":["Connaître son corps et comprendre ce qu’est l’intimité."],"4+":["Connaître son corps et identifier des émotions."],"5+":["Connaître son corps, ses sensations et ses émotions."]}},{"nom":"Notions et compétences","ages":{"<4":["Nommer les différentes parties du corps.","Prendre conscience de ce qu’est l’intimité : les parties intimes du corps ; les espaces d’intimité ; les mots, les gestes et les conduites associés.","Développer sa connaissance de soi.","Identifier les espaces où chacune et chacun a droit à son intimité par rapport aux adultes et aux autres élèves."],"4+":["Nommer les différentes parties du corps.","Découvrir ce qu’est une grossesse et la naissance.","Découvrir et identifier ses émotions (quatre des émotions de base : joie, tristesse, peur, colère), ses sentiments et les reconnaître quand on les ressent."],"5+":["Identifier ses émotions et sentiments et celles des autres.","Prendre conscience de la différence de sensations selon les personnes et du fait qu’un même évènement n’engendre pas la même réaction chez tous.","Communiquer de façon efficace et constructive."]}},{"nom":"Propositions de démarches et d’activités","ages":{"<4":["Nommer, par exemple à partir d’albums ou de jouets, les différentes parties du corps, les nommer en partant des dénominations spontanées pour aller vers un vocabulaire scientifique.","S’approprier la notion d’intimité à partir de différentes situations de la vie quotidienne, relatives par exemple à l’habillage-déshabillage (toilette, consultation médicale, à l’école) ou dans des albums traitant de ces situations."],"4+":["Repérer et nommer, à partir d’imagiers ou de planches dessinées, les différentes parties du corps, les ressemblances et les différences physiques entre les filles et les garçons.","Découvrir ce qu’est une grossesse et la naissance, en particulier à l’occasion de la naissance d’un enfant dans l’entourage de la classe et en partant des représentations des élèves.","Lors des parcours de motricité : exprimer sa peur de monter ou de descendre, sa joie de réussir, le plaisir d’essayer (et accepter de se tromper).","À partir de saynètes, d’albums, de productions écrites ou dessinées, nommer et décrire les émotions des personnages à la lecture des expressions de leur visage."],"5+":["À partir d’œuvres d’art comme des photos ou des tableaux, reconnaître ou dessiner un personnage joyeux ou triste pour identifier les manifestations physiques des émotions.","Mimer, recréer les expressions de son camarade en lien avec des émotions.","Apprendre à s’exprimer par des messages clairs, en particulier dans le champ des émotions. Lors d’une situation de conflit, participer à un temps pour exprimer clairement ses émotions dans le respect de l’autre.","Découvrir différents sens (voir, entendre, goûter, sentir, toucher), nommer son ressenti, l’exprimer à l’oral ou à l’écrit et observer que les réactions peuvent ne pas être les mêmes chez tous.","Apprendre à repérer les adultes qui seraient capables d’apporter de l’aide en cas de difficulté."]}}]},{"nom":"Rencontrer les autres et construire des relations, s’y épanouir","groupes":[{"nom":"Objectif d’apprentissage","ages":{"<4":["Apprendre à exprimer son accord ou son refus, apprendre à envisager et à respecter un refus."],"4+":["Identifier une personne de confiance (adulte, enfant), apprendre à faire appel à eux."],"5+":["Identifier différents types de sentiments dans sa relation à l’autre."]}},{"nom":"Notions et compétences","ages":{"<4":["Développer la capacité de s’affirmer par le consentement et le refus.","Développer la capacité de respecter le refus de l’autre."],"4+":["Définir la notion de confiance.","Définir un adulte de confiance comme étant un adulte à qui on peut parler et qui est susceptible d’apporter une aide et avec qui on se sent bien (école, famille, environnement médical, sportif, etc.).","Identifier un adulte de confiance.","Savoir qu’il existe des comportements interdits même avec un adulte de confiance.","Distinguer ce que l’on peut garder pour soi ou entre enfants (un secret), d’une situation de danger ou de violence qu’il est important de partager avec un adulte de confiance.","Renforcer son attention à ses sensations.","Savoir demander de l’aide pour soi ou pour les autres."],"5+":["Identifier différents types de sentiments (par exemple, l’amitié, l’amour).","Définir et prendre conscience de ce qu’est l’amitié.","Développer des liens sociaux positifs (par exemple, aller vers l’autre, entrer en relation, nouer des amitiés)."]}},{"nom":"Propositions de démarches et d’activités","ages":{"<4":["Apprendre à associer un geste à un mot simple (« non », « oui », « d’accord », « stop »), en particulier dans des situations qui nécessitent un contact physique (par exemple, « est-ce que je peux m’assoir à côté de toi ? »).","À partir de situations de la vie quotidienne, systématiser l’expression de son consentement ou son refus, ainsi que de son acceptation (avec les adultes et les élèves) : « Est-ce que je peux m’assoir à côté de toi ? » ; « Est-ce que je peux te prendre la main ? » ; « Est-ce que je peux te prendre dans mes bras pour te consoler ? » ; etc.","Au cours de séances d’activités physiques et artistiques : exprimer l’accord ou le désaccord par le geste et le déplacement à travers des rondes et jeux chantés et dansés ; effectuer une suite de mouvements et de déplacements sur la thématique consentement/refus, avec ou sans support musical."],"4+":["Décrire, à partir de la lecture d’albums sur des secrets, les émotions des personnages face au secret reçu, comprendre les motivations des créateurs du secret.","Découvrir qu’un secret ne doit pas faire de mal et que toute situation de malaise, de souffrance, de danger ne doit pas constituer un secret, mais doit être partagée avec un adulte de confiance. Prendre des exemples de secrets positifs (un poème, la fabrication d’un cadeau, d’une carte, etc.) et de situations qui nécessitent au contraire d’être signalées.","Créer collectivement une « marguerite des adultes de confiance », en s’appuyant sur les « marguerites » individuelles. Apprendre à repérer les adultes avec lesquels il est possible d’exprimer ses joies et ses peines, et qui seraient capables d’apporter de l’aide en cas de difficulté.","Explorer ce qui pourrait troubler cette confiance et provoquer un sentiment de malaise, de peur, etc.","Réfléchir aux changements possibles des personnes de confiance, si quelque chose fait peur ou met mal à l’aise dans la relation.","Apprendre à porter attention à ses sensations lors d’activités variées. Exprimer ensuite ce que l’on ressent, à l’oral ou à l’écrit.","Dans les situations de vie de la classe (difficulté face à une tâche à réaliser, conflit avec un autre élève, douleur, etc.), utiliser des outils ou des formules proposées par l’enseignant pour demander de l’aide ou aller dans un endroit de la classe défini comme « le coin de l’aide » (par exemple, lever une carte avec un symbole, dire « j’ai besoin d’aide », etc.)."],"5+":["Apprendre à définir sa relation aux autres et à exprimer les émotions qu’elle procure : une personne que j’aime bien ; une personne avec qui je suis à l’aise ; une personne qui m’écoute quand je parle ; une personne qui va toujours essayer de m’aider si j’ai un problème.","Décrire les composantes positives d’une relation à l’autre (par exemple, la confiance, l’échange, le respect, le soutien, l’empathie et l’entraide) et comment il est possible de les exprimer.","Expérimenter la notion de confiance au travers d’un jeu de motricité de type colin-maillard et exprimer ses ressentis (choix du partenaire, relation de confiance, émotions éventuelles).","Participer à des activités collaboratives ou coopératives avec d’autres élèves (y compris des élèves d’autres classes ou hors de son groupe d’amis), par exemple pour réaliser un parcours en motricité avec du matériel qu’il n’est pas possible de déplacer seul ou en jouant à des jeux de société collaboratifs. Exprimer, à l’oral ou à l’écrit, ce que l’on ressent quand on va demander quelque chose à quelqu’un qu’on connaît ou non.","Apprendre qu’il est possible de refuser une démarche ou une action sans remettre en question des liens d’amitié.","Lors de conflits, utiliser un « message clair » permettant d’exprimer dans un cadre choisi et expliqué à l’autre la contrariété vécue par l’un face au comportement de l’autre."]}}]},{"nom":"Trouver sa place dans la société, y être libre et responsable","groupes":[{"nom":"Objectif d’apprentissage","ages":{"<4":["Appréhender et comprendre l’égalité entre les filles et les garçons et la liberté d’être soi-même."],"4+":["Vivre l’égalité entre les filles et les garçons. Découvrir les différentes structures familiales et les respecter."],"5+":["Découvrir les ressemblances et les différences entre les autres et soi, respecter les autres dans leur différence ; être respecté par eux."]}},{"nom":"Notions et compétences","ages":{"<4":["Comprendre qu’une activité ou un métier peuvent être choisis indifféremment par les filles ou les garçons, en fonction des compétences requises et de l’envie de l’exercer."],"4+":["Prendre conscience qu’il est possible d’acquérir et de développer des compétences diversifiées, quel que soit son sexe.","Appréhender, comprendre et respecter les différentes structures familiales à partir de ce que l’élève a observé dans son environnement proche à cet âge.","Développer des liens sociaux (aller vers l’autre, entrer en relation, etc.)."],"5+":["Identifier les ressemblances et les différences physiques entre les filles et les garçons.","Décrire ce que signifie traiter quelqu’un avec respect et identifier les effets de ses paroles et de ses actes sur les autres.","Développer l’empathie et des relations sociales constructives (comportements tels que la collaboration, la coopération, l’entraide)."]}},{"nom":"Propositions de démarches et d’activités","ages":{"<4":["Lors d’une activité d’expression orale à partir d’un album jeunesse, ou d’activités menées en classe, comprendre que le choix d’une activité et les goûts ne sont pas prédéterminés par le fait d’être une fille ou un garçon.","Choisir parmi de nombreuses illustrations de métiers/activités/sports celles qu’on aime, qu’on voudrait faire et celles qu’on n’aime pas et que l’on n’aimerait pas faire ; expliquer les choix à l’oral ou à l’écrit.","Participer à des activités de classement et des jeux de la classe pour exprimer ses goûts (j’aime/je n’aime pas), réaliser une affiche avec les jeux préférés dans la classe et comprendre que ces jeux ne sont pas réservés aux filles ou aux garçons.","Décrire et échanger à partir de la lecture d’albums ou d’imagiers en explicitant les assignations de rôle et les stéréotypes perceptibles."],"4+":["Participer à des activités qui permettent de s’épanouir, par exemple à travers l’utilisation mixte, ouverte et proposée à tous, de tous les espaces de jeux (coin cuisine, garage, bricolage, déguisement), la participation aux activités artistiques et physiques, l’utilisation de matériel aux couleurs variées.","Décrire sa famille et son environnement proche (par exemple avec un support comme le cahier de vie de l’élève).","Lire des albums sur le thème : « Qu’est-ce qu’une famille ? ». Observer différents types de famille (images, photographies, récits). Parler de sa famille avec d’autres élèves."],"5+":["À partir d’albums de littérature jeunesse, identifier des ressemblances et des différences entre les personnages, les décrire sous la forme d’un texte.","Proposer et pratiquer des actions qui favorisent l’égalité entre les filles et les garçons, par exemple à propos de la répartition des espaces de cour disponibles et des jeux collectifs qui y sont menés.","À partir d’une image ou d’une photographie : décrire ce que ressentent les différents personnages, écrire un dialogue imaginaire entre les personnages, exprimant leurs pensées et émotions.","Participer à des jeux et activités collaboratifs ou coopératifs (jeux de société, co-construction)."]}}]}]}];

function $(s) { return document.querySelector(s); }
function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function fmtDate(s) { try { return new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(parseISO(s)); } catch (e) { return s; } }
function fmtShort(s) { try { return new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(parseISO(s)); } catch (e) { return s; } }
function fmtWd(s) { try { return new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }).format(parseISO(s)); } catch (e) { return s; } }
function hm(min) { min = Math.round(min || 0); var h = Math.floor(min / 60), m = min % 60; return h && m ? h + ' h ' + pad(m) : h ? h + ' h' : m + ' min'; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function domColor(name) { for (var i = 0; i < PROG.length; i++) if (PROG[i].nom === name) return DOMC[i % DOMC.length]; return MINEC; }

var _db = null;
function idb() {
  return new Promise(function (res, rej) {
    if (_db) return res(_db);
    var r = indexedDB.open('ma-classe-files', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('f'); };
    r.onsuccess = function () { _db = r.result; res(_db); };
    r.onerror = function () { rej(r.error); };
  });
}
function idbPut(id, blob) { return idb().then(function (db) { return new Promise(function (res, rej) { var t = db.transaction('f', 'readwrite'); t.objectStore('f').put(blob, id); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }); }
function idbGet(id) { return idb().then(function (db) { return new Promise(function (res, rej) { var q = db.transaction('f').objectStore('f').get(id); q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); }; }); }); }
function idbDel(id) { return idb().then(function (db) { return new Promise(function (res) { var t = db.transaction('f', 'readwrite'); t.objectStore('f').delete(id); t.oncomplete = res; t.onerror = res; }); }).catch(function () {}); }

function bankItem(id) { for (var i = 0; i < D.bank.length; i++) if (D.bank[i].id === id) return D.bank[i]; return null; }

function newSeance() { return { id: uid(), label: '', niveaux: [], obj: [], f: {} }; }

function tJournal() {
  if (S.blockId) return tBlock();
  var d = dayOf(S.date);
  var h = '<div class="row"><button type="button" class="chip" data-a="day" data-p="-1" aria-label="Jour précédent">‹</button><div class="grow" style="text-align:center"><h1 style="font-size:20px;margin:0">' + esc(fmtDate(S.date)) + '</h1></div><button type="button" class="chip" data-a="day" data-p="1" aria-label="Jour suivant">›</button></div>';
  h += '<div class="row" style="margin:10px 0"><button type="button" class="link" data-a="today">Aujourd’hui</button><span class="grow"></span><input type="date" id="jump" value="' + esc(S.date) + '" style="width:170px" aria-label="Choisir une date"></div>';
  var nv = d ? d.niveaux : ['PS', 'MS', 'GS'];
  h += '<div class="row wrap" style="margin:0 0 12px"><span class="muted small">Niveaux ce jour-là :</span>';
  ['PS', 'MS', 'GS'].forEach(function (n) { h += '<button type="button" class="chip' + (nv.indexOf(n) >= 0 ? ' on' : '') + '" data-a="dayLevel" data-p="' + n + '">' + n + '</button>'; });
  h += '</div>';
  var bl = d ? sortedBlocks(d) : [];
  if (!bl.length) {
    h += '<div class="card"><p>Aucun moment prévu ce jour-là.</p><p class="muted small">Pars d’une journée type, copie un autre jour, ou ajoute un moment : accueil, regroupement, ateliers, EPS…</p></div>';
  }

function download(name, text) {
  try {
    var blob = new Blob([text], { type: 'application/json' }), file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(function () {}); return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch (e) { S.msg = 'Impossible de créer la sauvegarde sur cet appareil.'; render(); }
}

function bind(key, val, checked) {

  else if (p[0] === 'b') { var b = curBlock(); if (b) b[p[1]] = p[1] === 'duree' ? (parseInt(val, 10) || 0) : val; }
  else if (p[0] === 's') {

    else if (p[2] === 'duree') s.duree = parseInt(val, 10) || 0;
    else if (p[2] === 'f') s.f[p[3]] = p[4] === 'c' ? (checked ? '1' : '') : val;
  }
  else if (p[0] === 'f') { D.fields.forEach(function (f) { if (f.id === p[1]) f[p[2]] = val; }); }
  saveSoon();
}

  }
  else if (a === 'toBank') { var s5 = seanceOf(p), b5 = curBlock(); if (s5) { S.sheet = { sid: p, title: b5 ? b5.titre : '' }; formSheet('Ranger dans ma banque', '<label for="kt">Titre</label><input type="text" id="kt" value="' + esc(b5 ? b5.titre : '') + '"><label for="kk">Type</label><select id="kk"><option value="atelier">Atelier</option><option value="rituel">Rituel</option></select>', 'Ranger', 'toBankOk', p); } }
  else if (a === 'toBankOk') { var s6 = seanceOf(p), b6 = curBlock(); if (s6) { var c6 = clone(s6); c6.id = uid(); c6.titre = ($('#kt').value || '').trim() || 'Sans titre'; c6.kind = $('#kk').value; c6.duree = b6 ? b6.duree || 0 : 0; D.bank.push(c6); save(); } S.sheet = null; closeSheet(); render(); }
  else if (a === 'fromBank') { fromBankSheet(); }
  else if (a === 'fromBankPick') {
    var it3 = bankItem(p), bk = curBlock(); if (it3 && bk) {
      var c7 = stripSeance(it3); bk.seances = bk.seances.filter(function (s) { return s.obj.length || Object.keys(s.f).some(function (k2) { return s.f[k2]; }) || s.label; });
      bk.seances.push(c7); if (!bk.titre) bk.titre = it3.titre; if (!bk.duree) bk.duree = it3.duree || 0; save();
    }
    closeSheet(); render();
  }
  /* à faire */
  else if (a === 'tdTag') { S.tdTag = p; var txt = $('#tdnew').value, dd2 = $('#tddate').value; render(); $('#tdnew').value = txt; $('#tddate').value = dd2; }
  else if (a === 'tdAdd') { var tx = ($('#tdnew').value || '').trim(); if (!tx) return; D.todo.push({ id: uid(), t: tx, date: $('#tddate').value || '', tag: S.tdTag, done: false }); save(); render(); $('#tdnew').focus(); }
  else if (a === 'tdTog') { D.todo.forEach(function (t) { if (t.id === p) t.done = !t.done; }); save(); render(); }
  else if (a === 'tdShow') { S.showDone = !S.showDone; render(); }
  else if (a === 'tdClear') { confirmSheet('Effacer toutes les tâches terminées ?', 'tdClearOk'); }
  else if (a === 'tdClearOk') { D.todo = D.todo.filter(function (t) { return !t.done; }); save(); closeSheet(); render(); }
  else if (a === 'tdEdit') {
    var t0 = D.todo.filter(function (t) { return t.id === p; })[0]; if (!t0) return; S.sheet = { tag: t0.tag };
    var tg = ''; TAGS.forEach(function (t) { tg += '<button type="button" class="chip' + (t0.tag === t[0] ? ' on' : '') + '" data-a="tdEditTag" data-p="' + t[0] + '">' + esc(t[1]) + '</button>'; });
    formSheet('Modifier la tâche', '<label for="tdt">Tâche</label><input type="text" id="tdt" value="' + esc(t0.t) + '"><label>Catégorie</label><div class="row wrap" id="tdtags">' + tg + '</div><label for="tdd">Date</label><input type="date" id="tdd" value="' + esc(t0.date) + '">', 'Enregistrer', 'tdSave', p, '<button type="button" class="btn danger" data-a="tdDel" data-p="' + p + '">Supprimer</button>');
  }
  else if (a === 'tdEditTag') { S.sheet.tag = p; document.querySelectorAll('#tdtags .chip').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-p') === p); }); }
  else if (a === 'tdSave') { D.todo.forEach(function (t) { if (t.id === p) { t.t = ($('#tdt').value || '').trim() || t.t; t.date = $('#tdd').value || ''; t.tag = (S.sheet && S.sheet.tag) || t.tag; } }); save(); closeSheet(); render(); }
  else if (a === 'tdDel') { D.todo = D.todo.filter(function (t) { return t.id !== p; }); save(); closeSheet(); render(); }
  /* comptines */
  else if (a === 'compNew') { S.cLev = ['PS', 'MS', 'GS']; openSheet(compSheet(null)); }
  else if (a === 'compEdit') { var c8 = findComp(p); if (c8) { S.cLev = (c8.niveaux || []).slice(); openSheet(compSheet(c8)); } }
  else if (a === 'cLevel') { var li = S.cLev.indexOf(p); if (li >= 0) S.cLev.splice(li, 1); else S.cLev.push(p); var chips = document.querySelectorAll('#panel .chip[data-a="cLevel"]'); chips.forEach(function (c) { c.classList.toggle('on', S.cLev.indexOf(c.getAttribute('data-p')) >= 0); }); }
  else if (a === 'compSave') { compSave(p); }
  else if (a === 'compDel') { confirmSheet('Supprimer cette comptine et ses fichiers ?', 'compDelOk', p); }
  else if (a === 'compDelOk') { var c9 = findComp(p); if (c9) { [c9.audioId, c9.pdfId].forEach(function (id) { if (id) idbDel(id); }); D.comptines = D.comptines.filter(function (x) { return x.id !== p; }); save(); } closeSheet(); render(); }
  else if (a === 'compPlay') {
    var c10 = findComp(p), box = $('#pl-' + p); if (!c10 || !box) return;
    if (box.firstChild) { box.innerHTML = ''; return; }
    idbGet(c10.audioId).then(function (blob) {
      if (!blob) { box.innerHTML = '<p class="small">Fichier introuvable sur cet appareil.</p>'; return; }
      var url = URL.createObjectURL(blob), isV = (blob.type || '').indexOf('video') === 0 || c10.audioType === 'video';
      box.innerHTML = '<' + (isV ? 'video' : 'audio') + ' controls playsinline src="' + url + '"></' + (isV ? 'video' : 'audio') + '>';
    }).catch(function () { box.innerHTML = '<p class="small">Impossible de lire ce fichier.</p>'; });
  }
  else if (a === 'compPdf') {
    var c11 = findComp(p); if (!c11) return;
    var w = null; try { w = window.open('', '_blank'); } catch (e) { w = null; }
    idbGet(c11.pdfId).then(function (blob) {
      if (!blob) { if (w) w.close(); return; }
      var url = URL.createObjectURL(new Blob([blob], { type: 'application/pdf' }));
      if (w) w.location.href = url; else window.location.href = url;
    }).catch(function () { if (w) w.close(); });
  }
  /* 108 h */
  else if (a === 'entryAdd' || a === 'entryEdit') {
    var c0b = findCat(p), e0 = null; if (a === 'entryEdit') c0b.entries.forEach(function (e) { if (e.id === q) e0 = e; });
    var mins = e0 ? e0.min : 60;
    formSheet(e0 ? 'Modifier cette saisie' : 'Ajouter des heures', '<label for="edate">Date</label><input type="date" id="edate" value="' + esc(e0 ? e0.date : iso(new Date())) + '"><div class="row"><div class="grow"><label for="eh">Heures</label><input type="number" id="eh" inputmode="numeric" min="0" value="' + Math.floor(mins / 60) + '"></div><div class="grow"><label for="em">Minutes</label><input type="number" id="em" inputmode="numeric" min="0" max="59" value="' + (mins % 60) + '"></div></div><label for="enote">Note (facultatif)</label><input type="text" id="enote" value="' + esc(e0 ? e0.note : '') + '" placeholder="Ex. : conseil des maîtres">', 'Enregistrer', 'entrySave', p + '|' + (e0 ? e0.id : ''), e0 ? '<button type="button" class="btn danger" data-a="entryDel" data-p="' + esc(p + '|' + e0.id) + '">Supprimer cette saisie</button>' : '');
  }
  else if (a === 'entrySave') {
    var pp = p.split('|'), c1 = findCat(pp[0]); if (!c1) return;
    var min = (parseInt($('#eh').value, 10) || 0) * 60 + (parseInt($('#em').value, 10) || 0), dt2 = $('#edate').value || iso(new Date()), nt = $('#enote').value;
    if (pp[1]) c1.entries.forEach(function (e) { if (e.id === pp[1]) { e.min = min; e.date = dt2; e.note = nt; } }); else c1.entries.push({ id: uid(), date: dt2, min: min, note: nt });
    save(); closeSheet(); render();
  }
  else if (a === 'entryDel') { var q2 = p.split('|'), c5 = findCat(q2[0]); if (c5) { c5.entries = c5.entries.filter(function (e) { return e.id !== q2[1]; }); save(); } closeSheet(); render(); }
  else if (a === 'catEdit' || a === 'catAdd') {
    var c6b = a === 'catEdit' ? findCat(p) : null;
    formSheet(c6b ? 'Modifier la catégorie' : 'Nouvelle catégorie', '<label for="cn">Nom</label><input type="text" id="cn" value="' + esc(c6b ? c6b.nom : '') + '"><label for="ct">Total d’heures prévu</label><input type="number" id="ct" inputmode="decimal" min="0" step="0.5" value="' + esc(c6b ? c6b.total : 0) + '">', 'Enregistrer', 'catSave', c6b ? c6b.id : '', c6b ? '<button type="button" class="btn danger" data-a="catDel" data-p="' + c6b.id + '">Supprimer la catégorie</button>' : '');
  }
  else if (a === 'catSave') {
    var nm2 = $('#cn').value.trim() || 'Sans nom', tt = parseFloat(String($('#ct').value).replace(',', '.')) || 0;
    if (p) { var c7b = findCat(p); if (c7b) { c7b.nom = nm2; c7b.total = tt; } } else D.cats.push({ id: uid(), nom: nm2, total: tt, entries: [] });
    save(); closeSheet(); render();
  }
  else if (a === 'catDel') { confirmSheet('Supprimer cette catégorie et toutes ses saisies ?', 'catDelOk', p); }
  else if (a === 'catDelOk') { D.cats = D.cats.filter(function (c) { return c.id !== p; }); save(); closeSheet(); render(); }
  /* champs */
  else if (a === 'fToggle') { D.fields.forEach(function (f) { if (f.id === p) f.on = !f.on; }); save(); render(); }
  else if (a === 'fMove') { var idx = -1; D.fields.forEach(function (f, i) { if (f.id === p) idx = i; }); var to2 = idx + parseInt(q, 10); if (idx >= 0 && to2 >= 0 && to2 < D.fields.length) { var t = D.fields[idx]; D.fields[idx] = D.fields[to2]; D.fields[to2] = t; save(); render(); } }
  else if (a === 'fDel') { confirmSheet('Supprimer ce champ ? Son contenu sera perdu dans toutes les séances.', 'fDelOk', p); }
  else if (a === 'fDelOk') { D.fields = D.fields.filter(function (f) { return f.id !== p; }); save(); closeSheet(); render(); }
  else if (a === 'fAdd') { formSheet('Nouveau champ', '<label for="fn">Nom du champ</label><input type="text" id="fn" placeholder="Ex. : Langage oral…"><label for="ft">Type</label><select id="ft"><option value="long">Texte long</option><option value="short">Texte court</option><option value="check">Case à cocher</option></select>', 'Ajouter', 'fAddOk'); }
  else if (a === 'fAddOk') { var fn = $('#fn').value.trim(); if (fn) { D.fields.push({ id: 'c' + uid(), label: fn, type: $('#ft').value, on: true }); save(); } closeSheet(); render(); }
  else if (a === 'export') { download('ma-classe-sauvegarde-' + iso(new Date()) + '.json', JSON.stringify({ app: 'ma-classe', v: 2, saved: new Date().toISOString(), data: D })); }
  else if (a === 'importOk') { D = S.sheet; fixData(); S.sheet = null; save(); S.msg = 'Sauvegarde restaurée.'; closeSheet(); render({ top: true }); }
}

function compSave(id) {
  var titre = ($('#ctitre').value || '').trim() || 'Sans titre', c = id ? findComp(id) : null;
  if (!c) { c = { id: uid(), niveaux: [] }; D.comptines.push(c); }
  c.titre = titre; c.periode = ($('#cper').value || '').trim(); c.lien = ($('#clien').value || '').trim(); c.notes = $('#cnotes').value || ''; c.current = $('#ccur').checked; c.niveaux = (S.cLev || []).slice();
  var aud = readFile('caud'), pdf = readFile('cpdf'), jobs = [], msg = $('#cmsg');
  if ($('#cdelaud') && $('#cdelaud').checked && c.audioId) { jobs.push(idbDel(c.audioId)); c.audioId = ''; c.audioName = ''; }
  if ($('#cdelpdf') && $('#cdelpdf').checked && c.pdfId) { jobs.push(idbDel(c.pdfId)); c.pdfId = ''; c.pdfName = ''; }
  if (aud) { if (c.audioId) jobs.push(idbDel(c.audioId)); c.audioId = 'a' + uid(); c.audioName = aud.name; c.audioType = (aud.type || '').indexOf('video') === 0 || /\.mp4$/i.test(aud.name) ? 'video' : 'audio'; jobs.push(idbPut(c.audioId, aud)); }
  if (pdf) { if (c.pdfId) jobs.push(idbDel(c.pdfId)); c.pdfId = 'p' + uid(); c.pdfName = pdf.name; jobs.push(idbPut(c.pdfId, pdf)); }
  if (msg) msg.textContent = jobs.length ? 'Enregistrement des fichiers…' : '';
  Promise.all(jobs).then(function () { save(); closeSheet(); render(); }).catch(function () { if (msg) msg.textContent = 'Impossible d’enregistrer un fichier (place insuffisante ?). Le reste est enregistré.'; if (aud) { c.audioId = ''; c.audioName = ''; } if (pdf) { c.pdfId = ''; c.pdfName = ''; } save(); });
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]'); if (!el) { if (ev.target.id === 'sheet') closeSheet(); return; }
  if (el.disabled) return;
  if (el.tagName === 'INPUT') return;
  act(el.getAttribute('data-a'), el.getAttribute('data-p'), el.getAttribute('data-q'));
});
document.addEventListener('input', function (ev) {
  var el = ev.target; if (el.id === 'bq') { S.bank.q = el.value; var bl = $('#banklist'); if (bl) bl.innerHTML = bankListHTML(); return; }
  var k = el.getAttribute && el.getAttribute('data-bind'); if (!k) return;
  bind(k, el.value, el.checked);
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.getAttribute && el.getAttribute('data-a') === 'tdTog') { act('tdTog', el.getAttribute('data-p')); return; }
  if (el.id === 'jump') { if (el.value) { S.date = el.value; S.blockId = null; render({ top: true }); } }
  else if (el.id === 'bdom') { S.bank.dom = el.value; render(); }
  else if (el.id === 'ikind') { /* déjà lié */ }
  else if (el.id === 'imp' && el.files && el.files[0]) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(String(fr.result));
        if (!o || o.app !== 'ma-classe' || !o.data || !o.data.fields || !o.data.days || !o.data.cats) throw new Error('bad');
        S.sheet = o.data; formSheet('Remplacer mes données ?', '<p>Cette sauvegarde va remplacer ce qui est enregistré sur ce téléphone.</p>', 'Oui, la restaurer', 'importOk');
      } catch (e) { S.msg = 'Ce fichier n’est pas une sauvegarde de cette appli.'; render(); }
    };
    fr.readAsText(el.files[0]); el.value = '';
  }
});
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
(function () { var v = $('#view'); function fix() { if (v.scrollLeft) v.scrollLeft = 0; if (document.documentElement.scrollLeft) document.documentElement.scrollLeft = 0; if (document.body.scrollLeft) document.body.scrollLeft = 0; } v.addEventListener('scroll', fix, { passive: true }); window.addEventListener('scroll', fix, { passive: true }); })();

load(); render();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
